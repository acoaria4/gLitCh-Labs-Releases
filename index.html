<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gLitCh Labs — Releases</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b12;
        --text: #f5f3ee;
        --muted: #a8a6b3;
        --accent: #d8c4a0;
        --line: rgba(255, 255, 255, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 500px at 80% -10%, rgba(216, 196, 160, 0.08), transparent),
          var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px 80px;
      }
      h1 {
        font-size: 2.4rem;
        letter-spacing: -0.04em;
        margin: 0 0 8px;
      }
      p { color: var(--muted); }
      .card {
        margin-top: 2rem;
        padding: 1.25rem 1.35rem;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
      }
      .card h2 {
        margin: 0 0 0.4rem;
        font-size: 1.25rem;
      }
      a { color: var(--accent); }
      ul { padding-left: 1.15rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>gLitCh Labs</h1>
      <p>Public releases, policies, and store assets for gLitCh Labs apps.</p>

      <section class="card">
        <h2>Expenses</h2>
        <p>Local-first personal + shared expense tracker.</p>
        <ul>
          <li><a href="./expenses/privacy.html">Privacy Policy</a></li>
          <li>
            <a href="https://github.com/acoaria4/expenses-by-glitchlabs">Source repository</a>
          </li>
        </ul>
      </section>

      <section class="card">
        <h2>AURA</h2>
        <p>Vedic astrology — charts, predictions, Porutham, and Tamil calendar.</p>
        <ul>
          <li><a href="./aura/privacy.html">Privacy Policy</a></li>
          <li>
            <a href="https://github.com/acoaria4/AstroAI">Source repository</a>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
