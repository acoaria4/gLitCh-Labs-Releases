  <body class="get-page">
    <!--
      THESIS: The mark is the page. Instagram visitors meet the Expenses E at scale, one line, two store taps — not a Linktree pill stack and not the studio nav-hero-resources template.
      OWN-WORLD: Near-black field with gold accent glow and grain; cream Satoshi UI; glass store plates; Expenses wordmark as the only product image.
      STORY: This is Expenses. Tap Google Play or App Store (TestFlight) to install the beta.
      FIRST VIEWPORT: Phone-width column centered in 100dvh. Wordmark fills the upper field. One muted sentence. Two full-width store buttons stacked — Play primary, App Store secondary. Tiny gLitCh Labs credit at the foot.
      FORM: Mark-as-page, locked by the approved plan (no concept-seed). Instagram bio, Persuade.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <main class="get">
      <h1 class="get-mark-wrap">
        <img
          class="get-mark"
          src="../../assets/expenses-wordmark.png"
          alt="Expenses"
          width="420"
          height="420"
        />
      </h1>
      <p class="get-lead">
        Local-first personal and shared expense tracking — with optional sign-in
        to sync when you’re ready.
      </p>
      <div class="get-cta">
        <a
          class="btn btn-primary get-store"
          href="https://play.google.com/store/apps/details?id=com.glitchlabs.expenses"
          target="_blank"
          rel="noopener noreferrer"
          data-store="play"
        >
          <svg class="get-store-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 3.6v16.8c0 .7.8 1.1 1.4.7L20.2 12 5.4 2.9C4.8 2.5 4 2.9 4 3.6Z"
            />
          </svg>
          Get on Google Play
          <span class="soon-label">Beta</span>
        </a>
        <a
          class="btn btn-secondary get-store"
          href="https://testflight.apple.com/join/HnCTs7QU"
          target="_blank"
          rel="noopener noreferrer"
          data-store="appstore"
        >
          <svg class="get-store-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M16.37 12.86c.03-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.71-3.18-1.73-1.34-.14-2.63.79-3.31.79-.69 0-1.74-.77-2.87-.75-1.47.02-2.83.86-3.58 2.18-1.54 2.66-.39 6.58 1.09 8.73.73 1.05 1.59 2.23 2.72 2.19 1.1-.05 1.51-.7 2.84-.7 1.32 0 1.69.7 2.86.68 1.18-.02 1.93-1.06 2.64-2.12.84-1.21 1.18-2.39 1.2-2.45-.03-.01-2.28-.87-2.3-3.51ZM14.7 6.4c.59-.72 1-1.72.89-2.72-.86.04-1.92.58-2.53 1.3-.55.64-1.04 1.67-.91 2.64.96.07 1.95-.49 2.55-1.22Z"
            />
          </svg>
          Download on the App Store
          <span class="soon-label">Beta</span>
        </a>
      </div>
      <p class="get-credit">
        <img
          src="../../assets/glitchlabs-icon.png"
          alt=""
          width="20"
          height="20"
        />
        gLitCh Labs
      </p>
    </main>
